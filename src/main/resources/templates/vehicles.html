<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Vehicle | Vehicle Rental System</title>

    <link rel="stylesheet" th:href="@{/style.css(v=4)}">
</head>

<body>

    <div class="page-container">

        <!-- Header -->
        <header class="page-header">
            <div>
                <h1>🚗 Add New Vehicle</h1>
                <p>Add a new vehicle to your rental inventory</p>
            </div>

            <a href="/vehicles" class="back-button">
                ← Back to Vehicles
            </a>
        </header>


        <!-- Add Vehicle Card -->
        <div class="form-card">

            <div class="form-title">
                <h2>Vehicle Details</h2>
                <p>Enter the details of the new vehicle below.</p>
            </div>

            <form action="/add-vehicle" method="post">

                <div class="form-grid">

                    <!-- Vehicle ID -->
                    <div class="form-group">
                        <label for="vehicleId">Vehicle ID</label>
                        <input
                            type="number"
                            id="vehicleId"
                            name="vehicleId"
                            placeholder="Enter vehicle ID"
                            required>
                    </div>


                    <!-- Vehicle Type -->
                    <div class="form-group">
                        <label for="type">Vehicle Type</label>

                        <select id="type" name="type" required>

                            <option value="">Select vehicle type</option>

                            <option value="Car">🚗 Car</option>

                            <option value="Bike">🏍️ Bike</option>

                            <option value="Van">🚐 Van</option>

                        </select>
                    </div>


                    <!-- Brand -->
                    <div class="form-group">
                        <label for="brand">Brand</label>

                        <input
                            type="text"
                            id="brand"
                            name="brand"
                            placeholder="e.g. Toyota"
                            required>
                    </div>


                    <!-- Model -->
                    <div class="form-group">
                        <label for="model">Model</label>

                        <input
                            type="text"
                            id="model"
                            name="model"
                            placeholder="e.g. Etios"
                            required>
                    </div>


                    <!-- Rental Rate -->
                    <div class="form-group full-width">
                        <label for="rentalRate">
                            Rental Rate Per Day
                        </label>

                        <div class="price-input">
                            <span>₹</span>

                            <input
                                type="number"
                                id="rentalRate"
                                name="rentalRate"
                                placeholder="Enter daily rental rate"
                                min="0"
                                step="0.01"
                                required>
                        </div>
                    </div>

                </div>


                <!-- Buttons -->
                <div class="form-actions">

                    <a href="/vehicles" class="cancel-button">
                        Cancel
                    </a>

                    <button type="submit" class="add-button">
                        + Add Vehicle
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
