<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Vehicles | Vehicle Rental System</title>

    <link rel="stylesheet" th:href="@{/style.css(v=5)}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            🚗 Vehicle Rental System
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/vehicles">Vehicles</a>
            <a href="/add-vehicle">Add Vehicle</a>
            <a href="/book">Book</a>
            <a href="/return">Return</a>
        </div>

    </nav>


    <!-- Header -->
    <section class="hero vehicle-hero">

        <div class="hero-content">

            <h1>Available Vehicles</h1>

            <p>
                Browse our vehicles and check their current availability.
            </p>

        </div>

    </section>


    <!-- Vehicles -->
    <section class="vehicle-section">

        <div class="vehicle-card"
             th:each="vehicle : ${vehicles}">

            <div>

                <div class="vehicle-icon">

                    <span th:if="${vehicle.type == 'Car'}">🚗</span>
                    <span th:if="${vehicle.type == 'Bike'}">🏍️</span>
                    <span th:if="${vehicle.type == 'Van'}">🚐</span>

                </div>

                <h2 th:text="${vehicle.brand + ' ' + vehicle.model}">
                    Toyota Etios
                </h2>


                <div class="vehicle-info">

                    <p>
                        <strong>Vehicle ID:</strong>
                        <span th:text="${vehicle.vehicleId}"></span>
                    </p>

                    <p>
                        <strong>Type:</strong>
                        <span th:text="${vehicle.type}"></span>
                    </p>

                    <p class="price">
                        ₹<span th:text="${vehicle.rentalRate}"></span>
                        <small>/ day</small>
                    </p>

                </div>


                <div class="status">

                    <span
                        th:if="${vehicle.available}"
                        class="available">
                        ● Available
                    </span>

                    <span
                        th:unless="${vehicle.available}"
                        class="rented">
                        ● Rented
                    </span>

                </div>

            </div>


            <!-- Buttons -->
            <div class="vehicle-button">

    <!-- Book -->
    <a
        th:if="${vehicle.available}"
        th:href="@{/book(vehicleId=${vehicle.vehicleId})}"
        class="btn">
        Book Vehicle
    </a>

    <span
        th:unless="${vehicle.available}"
        class="btn disabled-btn">
        Currently Rented
    </span>

    <!-- Update -->
    <a
        th:href="@{/update(vehicleId=${vehicle.vehicleId})}"
        class="btn">
        Update
    </a>

    <!-- Remove -->
    <form
        th:action="@{/remove}"
        method="post"
        style="display:inline;">

        <input
            type="hidden"
            name="vehicleId"
            th:value="${vehicle.vehicleId}">

        <button
            type="submit"
            class="btn remove-btn"
            onclick="return confirm('Are you sure you want to remove this vehicle?');">
            Remove
        </button>

    </form>

</div>
        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 Vehicle Rental System
        </p>

    </footer>

</body>

</html>
