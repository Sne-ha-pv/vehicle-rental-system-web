<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Vehicle | Vehicle Rental System</title>

    <link rel="stylesheet" th:href="@{/style.css(v=3)}">

    <style>
        .add-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff, #f8fafc);
            padding: 50px 20px;
        }

        .add-header {
            max-width: 950px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-header h1 {
            font-size: 34px;
            color: #111827;
            margin-bottom: 8px;
        }

        .add-header p {
            color: #6b7280;
            font-size: 16px;
        }

        .back-link {
            text-decoration: none;
            color: #2563eb;
            background: white;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .add-card {
            max-width: 950px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .card-heading {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .card-heading h2 {
            color: #111827;
            margin-bottom: 7px;
        }

        .card-heading p {
            color: #6b7280;
        }

        .vehicle-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            font-weight: bold;
            color: #374151;
            margin-bottom: 8px;
        }

        .field input,
        .field select {
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        .field input:focus,
        .field select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .rate-field {
            grid-column: 1 / 3;
        }

        .rate-box {
            display: flex;
            align-items: center;
        }

        .rate-symbol {
            padding: 14px 16px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-right: none;
            border-radius: 9px 0 0 9px;
            font-weight: bold;
        }

        .rate-box input {
            flex: 1;
            border-radius: 0 9px 9px 0;
        }

        .actions {
            grid-column: 1 / 3;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        .cancel-btn,
        .submit-btn {
            padding: 13px 24px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
        }

        .submit-btn {
            border: none;
            background: #2563eb;
            color: white;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .add-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .add-card {
                padding: 25px 20px;
            }

            .vehicle-form {
                grid-template-columns: 1fr;
            }

            .rate-field,
            .actions {
                grid-column: 1;
            }

            .actions {
                flex-direction: column;
            }

            .cancel-btn,
            .submit-btn {
                text-align: center;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

<div class="add-page">

    <div class="add-header">

        <div>
            <h1>🚗 Add New Vehicle</h1>
            <p>Add a vehicle to your rental inventory</p>
        </div>

        <a href="/" class="back-link">
    ← Back to Home
</a>

    </div>


    <div class="add-card">

        <div class="card-heading">
            <h2>Vehicle Details</h2>
            <p>Enter the information of the vehicle you want to add.</p>
        </div>


        <form action="/add-vehicle" method="post" class="vehicle-form">

            <div class="field">
                <label for="vehicleId">Vehicle ID</label>

                <input
                    type="number"
                    id="vehicleId"
                    name="vehicleId"
                    placeholder="Example: 105"
                    required>
            </div>


            <div class="field">
                <label for="type">Vehicle Type</label>

                <select id="type" name="type" required>

                    <option value="">Select vehicle type</option>
                    <option value="Car">🚗 Car</option>
                    <option value="Bike">🏍️ Bike</option>
                    <option value="Van">🚐 Van</option>

                </select>
            </div>


            <div class="field">
                <label for="brand">Brand</label>

                <input
                    type="text"
                    id="brand"
                    name="brand"
                    placeholder="Example: Toyota"
                    required>
            </div>


            <div class="field">
                <label for="model">Model</label>

                <input
                    type="text"
                    id="model"
                    name="model"
                    placeholder="Example: Etios"
                    required>
            </div>


            <div class="field rate-field">

                <label for="rentalRate">
                    Rental Rate Per Day
                </label>

                <div class="rate-box">

                    <span class="rate-symbol">₹</span>

                    <input
                        type="number"
                        id="rentalRate"
                        name="rentalRate"
                        placeholder="Example: 1500"
                        min="0"
                        step="0.01"
                        required>

                </div>

            </div>


            <div class="actions">

                <a href="/vehicles" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="submit-btn">
                    + Add Vehicle
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
